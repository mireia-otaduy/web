<!-- Llamada final a la acción (se repite en las páginas de contenido, no en contacto) -->
<section class="section cta" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta__card" data-reveal="zoom">
      <div class="cta__main is-dark">
        <p class="eyebrow">{{t:common.cta.eyebrow}}</p>
        <h2 id="cta-title" data-split="chars">{{t:common.cta.title}}</h2>
        <p class="lead">{{t:common.cta.text}}</p>
      </div>
      <div class="cta__actions" data-cascade>
        <a class="btn" href="{{link:contact}}#quote"><span>{{t:common.cta.quote}}</span>{{icon:arrow-right|class=btn__arrow}}</a>
        <a class="contact-chip" href="tel:{{s:phone.tel}}">
          {{icon:phone}}<span><small>{{t:common.cta.call}}</small><strong>{{s:phone.display}}</strong></span>
        </a>
        <a class="contact-chip" href="mailto:{{s:email}}">
          {{icon:mail}}<span><small>{{t:common.cta.write}}</small><strong>{{s:email}}</strong></span>
        </a>
      </div>
    </div>
  </div>
</section>
